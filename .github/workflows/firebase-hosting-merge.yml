name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No build step: the site in public/ is plain static files, and there is no
      # package.json at the repo root (the only one is in functions/).
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FURRY_FRIEND_FINDER_9AFD1 }}
          channelId: live
          projectId: furry-friend-finder-9afd1
